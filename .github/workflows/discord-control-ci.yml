name: Discord Control Activity CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "discord-control-bot/**"
      - ".github/workflows/discord-control-ci.yml"
  push:
    branches: [main, discord-nexus-unified, discord-nexus-build]
    paths:
      - "discord-control-bot/**"
      - ".github/workflows/discord-control-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-control-bot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check installer shell syntax
        run: bash -n deploy/install-user-service.sh scripts/preflight.sh
      - name: Run unit and API tests
        run: npm test
