name: Telegram bot reliability checks

on:
  push:
    paths:
      - "telegram-control-bot/**"
      - ".github/workflows/telegram-bot-tests.yml"
  pull_request:
    paths:
      - "telegram-control-bot/**"
      - ".github/workflows/telegram-bot-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install "python-telegram-bot>=21,<23" "httpx>=0.27,<1" "psutil>=5.9" "python-dotenv>=1"
      - name: Compile bot and tests
        run: python -m py_compile telegram-control-bot/bot.py telegram-control-bot/tests/test_bot_logic.py
      - name: Run deterministic regression tests
        working-directory: telegram-control-bot
        run: python -m unittest discover -s tests -v
